<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Laura 18 AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black !important;
  font-family: Arial, sans-serif;
}

a-scene {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  background: transparent !important;
  z-index: 2 !important;
}

a-scene canvas {
  background: transparent !important;
}

video,
video.mindar-video,
body > video {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  object-fit: cover !important;
  z-index: 1 !important;
  background: black !important;
}

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 25px;
  box-sizing: border-box;

  color: white;
  text-align: center;

  background:
    linear-gradient(
      180deg,
      #df9fba,
      #80608c
    );
}

#startBox {
  max-width: 420px;
  padding: 28px;

  border-radius: 28px;

  background:
    rgba(
      255,
      255,
      255,
      0.16
    );
}

#startBox h1 {
  margin-top: 0;
  font-size: 34px;
}

#startBox p {
  font-size: 18px;
  line-height: 1.5;
}

#startBtn {
  border: none;

  padding: 15px 32px;

  border-radius: 50px;

  background: white;

  color: #222;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;
}

#hint {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  z-index: 9998;

  display: none;

  width: 82%;

  padding: 10px 18px;

  box-sizing: border-box;

  border-radius: 30px;

  background:
    rgba(
      0,
      0,
      0,
      0.58
    );

  color: white;

  text-align: center;

  font-size: 14px;
}

</style>
</head>


<body>


<div id="startScreen">

  <div id="startBox">

    <h1>
      Laura 18 ✨
    </h1>

    <p>
      Kliknij START AR.
      <br><br>
      Zezwól na dostęp do aparatu.
      <br><br>
      Skieruj telefon na całą stronę
      <b>„OŻYW TEN ALBUM!”</b>.
    </p>

    <button id="startBtn">
      START AR
    </button>

  </div>

</div>


<div id="hint">
  Skieruj telefon na całą stronę i trzymaj stabilnie 📸
</div>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiScanning: yes;
    uiLoading: yes;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  embedded
>


<a-assets>

  <img id="img1"  src="./assets/01.jpg">
  <img id="img2"  src="./assets/02.jpg">
  <img id="img3"  src="./assets/03.jpg">
  <img id="img4"  src="./assets/04.jpg">
  <img id="img5"  src="./assets/05.jpg">

  <img id="img6"  src="./assets/06.jpg">
  <img id="img7"  src="./assets/07.jpg">
  <img id="img8"  src="./assets/08.jpg">
  <img id="img9"  src="./assets/09.jpg">
  <img id="img10" src="./assets/10.jpg">

  <img id="img11" src="./assets/11.jpg">
  <img id="img12" src="./assets/12.jpg">
  <img id="img13" src="./assets/13.jpg">
  <img id="img14" src="./assets/14.jpg">
  <img id="img15" src="./assets/15.jpg">

  <img id="img16" src="./assets/16.jpg">
  <img id="img17" src="./assets/17.jpg">
  <img id="img18" src="./assets/18.jpg">
  <img id="img19" src="./assets/19.jpg">
  <img id="img20" src="./assets/20.jpg">

</a-assets>


<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>


<a-entity
  id="target"
  mindar-image-target="targetIndex: 0">
</a-entity>


</a-scene>


<script>

const scene =
  document.querySelector("a-scene");

const target =
  document.getElementById("target");

const startScreen =
  document.getElementById("startScreen");

const startBtn =
  document.getElementById("startBtn");

const hint =
  document.getElementById("hint");


const images = [

  document.getElementById("img1"),
  document.getElementById("img2"),
  document.getElementById("img3"),
  document.getElementById("img4"),
  document.getElementById("img5"),

  document.getElementById("img6"),
  document.getElementById("img7"),
  document.getElementById("img8"),
  document.getElementById("img9"),
  document.getElementById("img10"),

  document.getElementById("img11"),
  document.getElementById("img12"),
  document.getElementById("img13"),
  document.getElementById("img14"),
  document.getElementById("img15"),

  document.getElementById("img16"),
  document.getElementById("img17"),
  document.getElementById("img18"),
  document.getElementById("img19"),
  document.getElementById("img20")

];


/*
====================================
ROZMIESZCZENIE 20 POLAROIDÓW
====================================
*/

const layouts = [

  {x:-0.38, y: 0.57, r:-10},
  {x:-0.12, y: 0.59, r:  6},
  {x: 0.14, y: 0.58, r: -6},
  {x: 0.38, y: 0.54, r: 10},

  {x:-0.40, y: 0.32, r:  8},
  {x:-0.14, y: 0.34, r: -8},
  {x: 0.13, y: 0.33, r:  6},
  {x: 0.39, y: 0.30, r: -9},

  {x:-0.39, y: 0.07, r: -7},
  {x:-0.13, y: 0.08, r:  7},
  {x: 0.14, y: 0.08, r: -6},
  {x: 0.40, y: 0.04, r:  9},

  {x:-0.39, y:-0.19, r:  8},
  {x:-0.13, y:-0.18, r: -8},
  {x: 0.14, y:-0.19, r:  6},
  {x: 0.39, y:-0.22, r: -8},

  {x:-0.34, y:-0.45, r:-9},
  {x:-0.09, y:-0.47, r:  7},
  {x: 0.17, y:-0.46, r: -7},
  {x: 0.37, y:-0.48, r:  9}

];


let tracking = false;
let playing = false;
let runId = 0;

let cards = [];
let confettiPieces = [];


function sleep(ms) {
  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );
}


function randomRange(min, max) {
  return min + Math.random() * (max - min);
}


/*
====================================
CZYSZCZENIE
====================================
*/

function clearCards() {

  cards.forEach(card => {

    if (card.parentNode) {
      card.parentNode.removeChild(card);
    }

  });

  cards = [];

}


function clearConfetti() {

  confettiPieces.forEach(piece => {

    if (piece.parentNode) {
      piece.parentNode.removeChild(piece);
    }

  });

  confettiPieces = [];

}


/*
====================================
POLAROID
====================================
*/

function createPolaroid(
  img,
  layout,
  index
) {

  const w =
    img.naturalWidth;

  const h =
    img.naturalHeight;


  if (!w || !h) {
    return null;
  }


  const ratio =
    w / h;


  let photoWidth;
  let photoHeight;


  if (ratio >= 1) {

    photoWidth =
      0.270;

    photoHeight =
      photoWidth / ratio;

  }

  else {

    photoHeight =
      0.270;

    photoWidth =
      photoHeight * ratio;

  }


  const frameWidth =

    Math.max(
      photoWidth + 0.040,
      0.185
    );


  const frameHeight =

    photoHeight +
    0.070;


  const card =
    document.createElement(
      "a-entity"
    );


  card.setAttribute(
    "scale",
    "0 0 0"
  );


  /*
  CIEŃ
  */

  const shadow =
    document.createElement(
      "a-plane"
    );


  shadow.setAttribute(
    "width",
    frameWidth + 0.015
  );


  shadow.setAttribute(
    "height",
    frameHeight + 0.015
  );


  shadow.setAttribute(
    "color",
    "#000000"
  );


  shadow.setAttribute(
    "position",
    "0.010 -0.010 -0.004"
  );


  shadow.setAttribute(
    "material",
    "shader: flat; transparent: true; opacity: 0.20"
  );


  /*
  BIAŁA RAMKA
  */

  const frame =
    document.createElement(
      "a-plane"
    );


  frame.setAttribute(
    "width",
    frameWidth
  );


  frame.setAttribute(
    "height",
    frameHeight
  );


  frame.setAttribute(
    "color",
    "#fffdf8"
  );


  frame.setAttribute(
    "position",
    "0 -0.014 0"
  );


  frame.setAttribute(
    "material",
    "shader: flat"
  );


  /*
  ZDJĘCIE
  */

  const picture =
    document.createElement(
      "a-image"
    );


  picture.setAttribute(
    "src",
    "#" + img.id
  );


  picture.setAttribute(
    "width",
    photoWidth
  );


  picture.setAttribute(
    "height",
    photoHeight
  );


  picture.setAttribute(
    "position",
    "0 0.010 0.003"
  );


  picture.setAttribute(
    "material",
    "shader: flat"
  );


  card.appendChild(shadow);
  card.appendChild(frame);
  card.appendChild(picture);

  target.appendChild(card);

  cards.push(card);


  return card;

}


/*
====================================
RZUT WSZYSTKICH POLAROIDÓW
JEDNYM RUCHEM
====================================
*/

function throwCard(
  card,
  layout,
  index
) {

  const zEnd =
    0.035 +
    index * 0.0025;


  /*
  WSPÓLNY PUNKT STARTOWY
  - prawa dolna część
  */

  const throwX =
    0.52 +
    randomRange(
      -0.05,
      0.05
    );


  const throwY =
    -0.72 +
    randomRange(
      -0.035,
      0.035
    );


  const throwZ =
    0.35 +
    randomRange(
      -0.025,
      0.025
    );


  /*
  MAŁE RÓŻNICE CZASU
  tworzą efekt jednego zamachu
  */

  const delay =
    randomRange(
      0,
      170
    );


  /*
  LOSOWY OBRÓT PODCZAS LOTU
  */

  const startRot =
    layout.r +
    randomRange(
      -40,
      40
    );


  card.setAttribute(
    "position",
    `${throwX} ${throwY} ${throwZ}`
  );


  card.setAttribute(
    "rotation",
    `0 0 ${startRot}`
  );


  card.setAttribute(
    "scale",
    "1.32 1.32 1.32"
  );


  /*
  LOT
  */

  card.setAttribute(
    "animation__throw",
    {

      property:
        "position",

      from:
        `${throwX} ${throwY} ${throwZ}`,

      to:
        `${layout.x} ${layout.y} ${zEnd}`,

      dur:
        950,

      delay:
        delay,

      easing:
        "easeOutCubic"

    }
  );


  /*
  ZMNIEJSZENIE
  */

  card.setAttribute(
    "animation__scale",
    {

      property:
        "scale",

      from:
        "1.32 1.32 1.32",

      to:
        "1 1 1",

      dur:
        950,

      delay:
        delay,

      easing:
        "easeOutBack"

    }
  );


  /*
  OBRÓT DO FINALNEGO POŁOŻENIA
  */

  card.setAttribute(
    "animation__rotation",
    {

      property:
        "rotation",

      from:
        `0 0 ${startRot}`,

      to:
        `0 0 ${layout.r}`,

      dur:
        950,

      delay:
        delay,

      easing:
        "easeOutCubic"

    }
  );

}


/*
====================================
KOLOROWE CONFETTI
====================================
*/

function launchConfetti() {

  clearConfetti();


  const colors = [

    "#ff1744",
    "#ff9100",
    "#ffd600",
    "#00e676",
    "#00b0ff",
    "#651fff",
    "#d500f9",
    "#ff4081",
    "#ffffff",
    "#00e5ff"

  ];


  for (
    let i = 0;
    i < 100;
    i++
  ) {


    const piece =
      document.createElement(
        i % 4 === 0
          ? "a-box"
          : "a-plane"
      );


    const color =

      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];


    const startX =
      (Math.random() - 0.5) *
      0.18;


    const startY =
      0.10 +
      Math.random() *
      0.12;


    const startZ =
      0.20 +
      Math.random() *
      0.08;


    const endX =
      (Math.random() - 0.5) *
      1.45;


    const endY =
      -0.70 +
      Math.random() *
      1.75;


    const endZ =
      0.04 +
      Math.random() *
      0.25;


    const size =
      0.012 +
      Math.random() *
      0.022;


    if (
      piece.tagName.toLowerCase() ===
      "a-box"
    ) {

      piece.setAttribute(
        "width",
        size
      );

      piece.setAttribute(
        "height",
        size * 2
      );

      piece.setAttribute(
        "depth",
        size * 0.35
      );

    }

    else {

      piece.setAttribute(
        "width",
        size
      );

      piece.setAttribute(
        "height",
        size * 2.1
      );

    }


    piece.setAttribute(
      "color",
      color
    );


    piece.setAttribute(
      "material",
      "shader: flat; transparent: true; opacity: 1; side: double"
    );


    piece.setAttribute(
      "position",
      `${startX} ${startY} ${startZ}`
    );


    const rx =
      Math.random() * 360;

    const ry =
      Math.random() * 360;

    const rz =
      Math.random() * 360;


    piece.setAttribute(
      "rotation",
      `${rx} ${ry} ${rz}`
    );


    piece.setAttribute(
      "scale",
      "0 0 0"
    );


    target.appendChild(
      piece
    );


    confettiPieces.push(
      piece
    );


    const delay =
      Math.random() * 650;


    const duration =
      2200 +
      Math.random() * 1800;


    piece.setAttribute(
      "animation__move",
      {

        property:
          "position",

        from:
          `${startX} ${startY} ${startZ}`,

        to:
          `${endX} ${endY} ${endZ}`,

        dur:
          duration,

        delay:
          delay,

        easing:
          "easeOutCubic"

      }
    );


    piece.setAttribute(
      "animation__grow",
      {

        property:
          "scale",

        from:
          "0 0 0",

        to:
          "1 1 1",

        dur:
          250,

        delay:
          delay,

        easing:
          "easeOutBack"

      }
    );


    piece.setAttribute(
      "animation__spin",
      {

        property:
          "rotation",

        from:
          `${rx} ${ry} ${rz}`,

        to:
          `${rx + 720} ${ry + 540} ${rz + 1080}`,

        dur:
          duration,

        delay:
          delay,

        easing:
          "linear"

      }
    );


    piece.setAttribute(
      "animation__fade",
      {

        property:
          "material.opacity",

        from:
          1,

        to:
          0,

        dur:
          900,

        delay:
          delay +
          duration -
          850,

        easing:
          "linear"

      }
    );

  }


  setTimeout(
    () => {

      if (tracking) {
        launchSecondBurst();
      }

    },
    1100
  );

}


/*
====================================
DRUGA FALA CONFETTI
====================================
*/

function launchSecondBurst() {


  const colors = [

    "#ff1744",
    "#ffd600",
    "#00e676",
    "#00b0ff",
    "#d500f9",
    "#ff4081",
    "#ffffff"

  ];


  for (
    let i = 0;
    i < 45;
    i++
  ) {


    const piece =
      document.createElement(
        "a-plane"
      );


    const side =
      i % 2 === 0
        ? -1
        : 1;


    const startX =
      side * 0.42;


    const startY =
      -0.20 +
      Math.random() *
      0.25;


    const startZ =
      0.16;


    const endX =
      startX +
      side *
      (
        0.20 +
        Math.random() *
        0.40
      );


    const endY =
      0.20 +
      Math.random() *
      0.85;


    const endZ =
      0.05 +
      Math.random() *
      0.20;


    const size =
      0.014 +
      Math.random() *
      0.020;


    piece.setAttribute(
      "width",
      size
    );


    piece.setAttribute(
      "height",
      size * 2
    );


    piece.setAttribute(
      "color",
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ]
    );


    piece.setAttribute(
      "material",
      "shader: flat; transparent: true; opacity: 1; side: double"
    );


    piece.setAttribute(
      "position",
      `${startX} ${startY} ${startZ}`
    );


    target.appendChild(
      piece
    );


    confettiPieces.push(
      piece
    );


    const delay =
      Math.random() *
      450;


    piece.setAttribute(
      "animation__move",
      {

        property:
          "position",

        from:
          `${startX} ${startY} ${startZ}`,

        to:
          `${endX} ${endY} ${endZ}`,

        dur:
          1800 +
          Math.random() *
          900,

        delay:
          delay,

        easing:
          "easeOutCubic"

      }
    );


    piece.setAttribute(
      "animation__spin",
      {

        property:
          "rotation",

        from:
          "0 0 0",

        to:
          "360 720 720",

        dur:
          2200,

        delay:
          delay,

        easing:
          "linear"

      }
    );


    piece.setAttribute(
      "animation__fade",
      {

        property:
          "material.opacity",

        from:
          1,

        to:
          0,

        dur:
          700,

        delay:
          delay + 1600,

        easing:
          "linear"

      }
    );

  }

}


/*
====================================
START - WSZYSTKIE ZDJĘCIA NARAZ
====================================
*/

async function startPolaroids() {


  if (playing) {
    return;
  }


  playing = true;


  const currentRun =
    ++runId;


  clearCards();
  clearConfetti();


  /*
  NAJPIERW TWORZYMY WSZYSTKIE KARTY
  */

  const preparedCards = [];


  for (
    let i = 0;
    i < images.length;
    i++
  ) {


    if (
      !tracking ||
      currentRun !== runId
    ) {
      break;
    }


    const img =
      images[i];


    if (!img.complete) {

      await new Promise(
        resolve => {

          img.onload = resolve;
          img.onerror = resolve;

        }
      );

    }


    const card =
      createPolaroid(
        img,
        layouts[i],
        i
      );


    if (card) {

      preparedCards.push({
        card: card,
        layout: layouts[i],
        index: i
      });

    }

  }


  /*
  A TERAZ RZUCAMY WSZYSTKIE
  PRAWIE JEDNOCZEŚNIE
  */

  preparedCards.forEach(item => {

    throwCard(
      item.card,
      item.layout,
      item.index
    );

  });


  /*
  CZEKAMY, AŻ WYLĄDUJĄ
  */

  await sleep(
    1500
  );


  /*
  CONFETTI
  */

  if (
    tracking &&
    currentRun === runId
  ) {

    launchConfetti();

  }


  playing = false;

}


/*
====================================
START AR
====================================
*/

startBtn.addEventListener(
  "click",
  async () => {


    startScreen.style.display =
      "none";


    hint.style.display =
      "block";


    await scene
      .systems[
        "mindar-image-system"
      ]
      .start();

  }
);


/*
====================================
MARKER ZNALEZIONY
====================================
*/

target.addEventListener(
  "targetFound",
  () => {


    if (tracking) {
      return;
    }


    tracking =
      true;


    hint.style.display =
      "none";


    startPolaroids();

  }
);


/*
====================================
MARKER ZGUBIONY
====================================
*/

target.addEventListener(
  "targetLost",
  () => {


    tracking =
      false;


    runId++;


    playing =
      false;


    clearCards();
    clearConfetti();


    hint.style.display =
      "block";

  }
);


</script>


</body>

</html>
