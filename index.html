<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Laura AR Polaroid</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: transparent !important;

  font-family: Arial, sans-serif;
}


a-scene {
  position: fixed !important;

  top: 0 !important;
  left: 0 !important;

  width: 100% !important;
  height: 100% !important;

  background: transparent !important;
}


canvas {
  background: transparent !important;
}


video.mindar-video,
body > video {

  position: fixed !important;

  top: 0 !important;
  left: 0 !important;

  width: 100vw !important;
  height: 100vh !important;

  object-fit: cover !important;

  z-index: -1 !important;
}


#startScreen {

  position: fixed;

  inset: 0;

  z-index: 9999;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 25px;

  box-sizing: border-box;

  color: white;

  text-align: center;

  background:

    linear-gradient(
      180deg,
      #ff4fa0,
      #805cff
    );

}


#startBox {

  width: 100%;

  max-width: 420px;

  padding: 28px;

  box-sizing: border-box;

  border-radius: 25px;

  background:

    rgba(
      255,
      255,
      255,
      0.15
    );

}


#startBox h1 {

  margin-top: 0;

  font-size: 34px;

}


#startBox p {

  font-size: 18px;

  line-height: 1.5;

}


#startBtn {

  border: none;

  background: white;

  color: black;

  padding: 15px 30px;

  border-radius: 50px;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

}


#hint {

  position: fixed;

  left: 50%;

  bottom: 20px;

  transform: translateX(-50%);

  z-index: 9998;

  display: none;

  width: 80%;

  padding: 10px 18px;

  box-sizing: border-box;

  background: rgba(0,0,0,0.65);

  color: white;

  border-radius: 25px;

  text-align: center;

  font-size: 14px;

}

</style>

</head>



<body>


<!-- EKRAN STARTOWY -->


<div id="startScreen">

  <div id="startBox">

    <h1>
      Ożyw ten album 💖
    </h1>


    <p>

      Kliknij START AR.

      <br><br>

      Zezwól na dostęp do aparatu.

      <br><br>

      Skieruj telefon na całą stronę

      <b>
        „OŻYW TEN ALBUM!”
      </b>

    </p>


    <button id="startBtn">

      START AR

    </button>

  </div>

</div>



<div id="hint">

  Skieruj telefon na całą stronę i trzymaj stabilnie 📸

</div>




<!-- AR -->


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiScanning: yes;
    uiLoading: yes;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

  embedded

>


<!-- ZDJĘCIA -->


<a-assets>

  <img id="img1" src="./assets/01.jpg">
  <img id="img2" src="./assets/02.jpg">
  <img id="img3" src="./assets/03.jpg">
  <img id="img4" src="./assets/04.jpg">
  <img id="img5" src="./assets/05.jpg">

  <img id="img6" src="./assets/06.jpg">
  <img id="img7" src="./assets/07.jpg">
  <img id="img8" src="./assets/08.jpg">
  <img id="img9" src="./assets/09.jpg">
  <img id="img10" src="./assets/10.jpg">

  <img id="img11" src="./assets/11.jpg">
  <img id="img12" src="./assets/12.jpg">
  <img id="img13" src="./assets/13.jpg">
  <img id="img14" src="./assets/14.jpg">
  <img id="img15" src="./assets/15.jpg">

</a-assets>



<a-camera

  position="0 0 0"

  look-controls="
    enabled: false
  "

></a-camera>




<!-- MARKER -->


<a-entity

  id="target"

  mindar-image-target="
    targetIndex: 0
  "

>


<!--
POLAROIDY ZOSTANĄ
DODANE TUTAJ
AUTOMATYCZNIE
-->


</a-entity>


</a-scene>




<script>


const scene =
  document.querySelector(
    "a-scene"
  );


const target =
  document.getElementById(
    "target"
  );


const button =
  document.getElementById(
    "startBtn"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const hint =
  document.getElementById(
    "hint"
  );




/*
========================================
ZDJĘCIA
========================================
*/


const images = [

  document.getElementById("img1"),
  document.getElementById("img2"),
  document.getElementById("img3"),
  document.getElementById("img4"),
  document.getElementById("img5"),

  document.getElementById("img6"),
  document.getElementById("img7"),
  document.getElementById("img8"),
  document.getElementById("img9"),
  document.getElementById("img10"),

  document.getElementById("img11"),
  document.getElementById("img12"),
  document.getElementById("img13"),
  document.getElementById("img14"),
  document.getElementById("img15")

];




/*
========================================
ROZMIESZCZENIE POLAROIDÓW

Każdy ma własne miejsce.

x = lewo / prawo
y = góra / dół
rotation = obrót
========================================
*/


const layouts = [


  {
    x: -0.40,
    y: 0.56,
    r: -10
  },


  {
    x: -0.11,
    y: 0.57,
    r: 6
  },


  {
    x: 0.22,
    y: 0.55,
    r: -5
  },


  {
    x: 0.43,
    y: 0.35,
    r: 9
  },


  {
    x: -0.43,
    y: 0.30,
    r: 8
  },


  {
    x: -0.13,
    y: 0.29,
    r: -6
  },


  {
    x: 0.16,
    y: 0.28,
    r: 7
  },


  {
    x: -0.39,
    y: 0.02,
    r: -8
  },


  {
    x: -0.10,
    y: 0.02,
    r: 4
  },


  {
    x: 0.20,
    y: 0.02,
    r: -5
  },


  {
    x: 0.43,
    y: -0.10,
    r: 8
  },


  {
    x: -0.40,
    y: -0.28,
    r: 6
  },


  {
    x: -0.12,
    y: -0.30,
    r: -7
  },


  {
    x: 0.18,
    y: -0.31,
    r: 5
  },


  {
    x: 0.02,
    y: -0.57,
    r: -3
  }

];




let tracking = false;


let playing = false;


let runId = 0;


let cards = [];




function sleep(ms) {

  return new Promise(

    resolve =>

      setTimeout(
        resolve,
        ms
      )

  );

}




/*
========================================
USUWANIE STARYCH POLAROIDÓW
========================================
*/


function clearCards() {


  cards.forEach(

    card => {


      if (
        card.parentNode
      ) {

        card.parentNode
          .removeChild(card);

      }


    }

  );


  cards = [];

}




/*
========================================
TWORZENIE POLAROIDA
========================================
*/


function createPolaroid(
  img,
  layout,
  index
) {


  const w =
    img.naturalWidth;


  const h =
    img.naturalHeight;




  if (
    !w ||
    !h
  ) {

    return null;

  }




  const ratio =
    w / h;




  /*
  ROZMIAR SAMEGO ZDJĘCIA
  */


  let photoWidth;

  let photoHeight;




  if (
    ratio >= 1
  ) {


    /*
    POZIOME
    */


    photoWidth =
      0.205;


    photoHeight =
      photoWidth /
      ratio;


  }


  else {


    /*
    PIONOWE
    */


    photoHeight =
      0.205;


    photoWidth =
      photoHeight *
      ratio;


  }




  /*
  MINIMALNA SZEROKOŚĆ,
  ŻEBY POLAROID NIE BYŁ
  ZBYT WĄSKI
  */


  const frameWidth =

    Math.max(
      photoWidth + 0.035,
      0.145
    );




  /*
  BIAŁY DÓŁ POLAROIDA
  JEST WIĘKSZY
  */


  const frameHeight =

    photoHeight +
    0.065;




  /*
  CAŁY POLAROID
  */


  const card =
    document.createElement(
      "a-entity"
    );




  card.setAttribute(

    "position",

    `${layout.x} ${layout.y} ${0.035 + index * 0.002}`

  );




  card.setAttribute(

    "rotation",

    `0 0 ${layout.r}`

  );




  card.setAttribute(

    "scale",

    "0 0 0"

  );




  /*
  BIAŁA RAMKA
  */


  const frame =
    document.createElement(
      "a-plane"
    );




  frame.setAttribute(
    "width",
    frameWidth
  );


  frame.setAttribute(
    "height",
    frameHeight
  );


  frame.setAttribute(
    "color",
    "#ffffff"
  );


  frame.setAttribute(

    "position",

    `0 ${-0.015} 0`

  );




  frame.setAttribute(

    "material",

    "shader: flat"

  );




  /*
  ZDJĘCIE
  */


  const picture =
    document.createElement(
      "a-image"
    );




  picture.setAttribute(

    "src",

    "#" + img.id

  );




  picture.setAttribute(

    "width",

    photoWidth

  );




  picture.setAttribute(

    "height",

    photoHeight

  );




  /*
  LEKKO WYŻEJ,
  ŻEBY ZOSTAŁ
  BIAŁY PASEK NA DOLE
  */


  picture.setAttribute(

    "position",

    `0 0.010 0.002`

  );




  picture.setAttribute(

    "material",

    "shader: flat"

  );




  card.appendChild(
    frame
  );


  card.appendChild(
    picture
  );


  target.appendChild(
    card
  );


  cards.push(
    card
  );



  return card;

}




/*
========================================
ANIMACJA WPADANIA POLAROIDA

Wygląda jak zdjęcie
spadające na stół.
========================================
*/


async function dropCard(
  card,
  layout,
  index,
  currentRun
) {


  if (
    !tracking ||
    currentRun !== runId
  ) {

    return;

  }




  /*
  START:

  większe,
  wyżej nad kartką,
  lekko bardziej obrócone
  */


  card.setAttribute(

    "position",

    `${layout.x} ${layout.y + 0.14} ${0.30 + index * 0.003}`

  );


  card.setAttribute(

    "rotation",

    `0 0 ${layout.r - 10}`

  );


  card.setAttribute(

    "scale",

    "1.35 1.35 1.35"

  );




  /*
  SPADANIE NA KARTKĘ
  */


  card.setAttribute(

    "animation__drop",

    {

      property:
        "position",

      from:
        `${layout.x} ${layout.y + 0.14} ${0.30 + index * 0.003}`,

      to:
        `${layout.x} ${layout.y} ${0.035 + index * 0.002}`,

      dur:
        850,

      easing:
        "easeOutBounce"

    }

  );




  /*
  ZMNIEJSZENIE
  */


  card.setAttribute(

    "animation__scale",

    {

      property:
        "scale",

      from:
        "1.35 1.35 1.35",

      to:
        "1 1 1",

      dur:
        850,

      easing:
        "easeOutCubic"

    }

  );




  /*
  DELIKATNY OBRÓT
  */


  card.setAttribute(

    "animation__rotate",

    {

      property:
        "rotation",

      from:
        `0 0 ${layout.r - 10}`,

      to:
        `0 0 ${layout.r}`,

      dur:
        850,

      easing:
        "easeOutCubic"

    }

  );

}




/*
========================================
ROZSYPYWANIE 15 ZDJĘĆ
========================================
*/


async function startPolaroids() {


  if (
    playing
  ) {

    return;

  }


  playing =
    true;


  const currentRun =
    ++runId;




  clearCards();




  for (
    let i = 0;
    i < images.length;
    i++
  ) {


    if (
      !tracking ||
      currentRun !== runId
    ) {

      break;

    }




    const img =
      images[i];




    /*
    JEŚLI OBRAZ JESZCZE
    SIĘ NIE ZAŁADOWAŁ
    */


    if (
      !img.complete
    ) {


      await new Promise(

        resolve => {


          img.onload =
            resolve;


          img.onerror =
            resolve;


        }

      );


    }




    if (
      !tracking ||
      currentRun !== runId
    ) {

      break;

    }




    const card =
      createPolaroid(

        img,

        layouts[i],

        i

      );




    if (
      card
    ) {


      dropCard(

        card,

        layouts[i],

        i,

        currentRun

      );


    }




    /*
    CZAS MIĘDZY
    KOLEJNYMI ZDJĘCIAMI

    1100 = 1,1 sekundy
    */


    await sleep(
      1100
    );

  }




  playing =
    false;

}




/*
========================================
START APARATU
========================================
*/


button.addEventListener(

  "click",

  async () => {


    startScreen.style.display =
      "none";


    hint.style.display =
      "block";


    await scene
      .systems[
        "mindar-image-system"
      ]
      .start();


  }

);




/*
========================================
MARKER ZNALEZIONY
========================================
*/


target.addEventListener(

  "targetFound",

  () => {


    /*
    JEŚLI JUŻ GO WIDZIMY,
    NIE URUCHAMIAJ DRUGIEGO
    POKAZU
    */


    if (
      tracking
    ) {

      return;

    }




    tracking =
      true;


    hint.style.display =
      "none";


    startPolaroids();


  }

);




/*
========================================
MARKER ZGUBIONY
========================================
*/


target.addEventListener(

  "targetLost",

  () => {


    tracking =
      false;


    runId++;


    playing =
      false;


    clearCards();


    hint.style.display =
      "block";

  }

);


</script>


</body>

</html>
