<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Laura AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    canvas {
      background: transparent !important;
    }

    video.mindar-video,
    body > video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -1 !important;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      background: linear-gradient(
        180deg,
        #ff4fa0,
        #805cff
      );

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;
      text-align: center;

      padding: 25px;
      box-sizing: border-box;
    }

    #startBox {
      max-width: 420px;

      background: rgba(255,255,255,0.15);

      padding: 25px;

      border-radius: 25px;
    }

    #startBox h1 {
      margin-top: 0;
      font-size: 34px;
    }

    #startBox p {
      font-size: 18px;
      line-height: 1.5;
    }

    #startBtn {
      border: none;

      background: white;
      color: black;

      font-size: 18px;
      font-weight: bold;

      padding: 15px 30px;

      border-radius: 50px;

      cursor: pointer;
    }

    #hint {
      position: fixed;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      z-index: 9998;

      display: none;

      background: rgba(0,0,0,0.6);

      color: white;

      padding: 10px 18px;

      border-radius: 25px;

      text-align: center;

      width: 80%;
    }

  </style>

</head>


<body>


  <!-- EKRAN STARTOWY -->

  <div id="startScreen">

    <div id="startBox">

      <h1>
        Ożyw ten album 💖
      </h1>

      <p>

        Kliknij START AR.

        <br><br>

        Zezwól na dostęp do aparatu.

        <br><br>

        Skieruj telefon na całą stronę
        „OŻYW TEN ALBUM!”.

      </p>

      <button id="startBtn">
        START AR
      </button>

    </div>

  </div>


  <!-- PODPOWIEDŹ -->

  <div id="hint">
    Skieruj telefon na całą stronę i trzymaj stabilnie 📸
  </div>



  <!-- SCENA AR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

    embedded

  >


    <!-- ZDJĘCIA -->

    <a-assets>

      <img id="img1" src="./assets/01.jpg">
      <img id="img2" src="./assets/02.jpg">
      <img id="img3" src="./assets/03.jpg">
      <img id="img4" src="./assets/04.jpg">
      <img id="img5" src="./assets/05.jpg">
      <img id="img6" src="./assets/06.jpg">
      <img id="img7" src="./assets/07.jpg">
      <img id="img8" src="./assets/08.jpg">
      <img id="img9" src="./assets/09.jpg">
      <img id="img10" src="./assets/10.jpg">
      <img id="img11" src="./assets/11.jpg">
      <img id="img12" src="./assets/12.jpg">
      <img id="img13" src="./assets/13.jpg">
      <img id="img14" src="./assets/14.jpg">
      <img id="img15" src="./assets/15.jpg">

    </a-assets>


    <!-- KAMERA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- MARKER -->

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <a-image

        id="photo"

        visible="false"

        position="0 0 0.06"

        material="
          transparent: true;
          opacity: 1;
          shader: flat;
        "

      ></a-image>

    </a-entity>


  </a-scene>



  <script>

    const scene =
      document.querySelector("a-scene");

    const target =
      document.getElementById("target");

    const photo =
      document.getElementById("photo");

    const button =
      document.getElementById("startBtn");

    const startScreen =
      document.getElementById("startScreen");

    const hint =
      document.getElementById("hint");


    const images = [

      document.getElementById("img1"),
      document.getElementById("img2"),
      document.getElementById("img3"),
      document.getElementById("img4"),
      document.getElementById("img5"),
      document.getElementById("img6"),
      document.getElementById("img7"),
      document.getElementById("img8"),
      document.getElementById("img9"),
      document.getElementById("img10"),
      document.getElementById("img11"),
      document.getElementById("img12"),
      document.getElementById("img13"),
      document.getElementById("img14"),
      document.getElementById("img15")

    ];


    let tracking = false;

    let slideshowRunning = false;

    let runNumber = 0;



    button.addEventListener(
      "click",
      async () => {

        startScreen.style.display =
          "none";

        hint.style.display =
          "block";

        await scene
          .systems["mindar-image-system"]
          .start();

      }
    );



    function sleep(ms) {

      return new Promise(
        resolve =>
          setTimeout(resolve, ms)
      );

    }



    function setSize(img) {

      const w =
        img.naturalWidth;

      const h =
        img.naturalHeight;


      if (!w || !h) {

        return;

      }


      const ratio =
        w / h;


      const maxWidth =
        0.48;

      const maxHeight =
        0.55;


      let width;

      let height;


      if (ratio >= 1) {

        width =
          maxWidth;

        height =
          width / ratio;


        if (height > maxHeight) {

          height =
            maxHeight;

          width =
            height * ratio;

        }

      }

      else {

        height =
          maxHeight;

        width =
          height * ratio;


        if (width > maxWidth) {

          width =
            maxWidth;

          height =
            width / ratio;

        }

      }


      photo.setAttribute(
        "width",
        width
      );

      photo.setAttribute(
        "height",
        height
      );

    }



    async function startSlideshow() {

      if (slideshowRunning) {

        return;

      }


      slideshowRunning =
        true;


      const thisRun =
        ++runNumber;


      for (
        let i = 0;
        i < images.length;
        i++
      ) {


        if (
          !tracking ||
          thisRun !== runNumber
        ) {

          break;

        }


        const img =
          images[i];


        photo.removeAttribute(
          "animation__zoom"
        );


        photo.removeAttribute(
          "animation__fade"
        );


        photo.setAttribute(
          "visible",
          false
        );


        photo.setAttribute(
          "material",
          "opacity",
          0
        );


        await sleep(250);


        if (
          !tracking ||
          thisRun !== runNumber
        ) {

          break;

        }


        setSize(img);


        photo.setAttribute(
          "src",
          "#" + img.id
        );


        photo.setAttribute(
          "scale",
          "0.20 0.20 0.20"
        );


        photo.setAttribute(
          "position",
          "0 0 0.06"
        );


        photo.setAttribute(
          "material",
          "opacity",
          1
        );


        photo.setAttribute(
          "visible",
          true
        );


        photo.setAttribute(
          "animation__zoom",
          {

            property:
              "scale",

            from:
              "0.20 0.20 0.20",

            to:
              "1.10 1.10 1.10",

            dur:
              2400,

            easing:
              "easeOutCubic"

          }
        );


        await sleep(2600);


        if (
          !tracking ||
          thisRun !== runNumber
        ) {

          break;

        }


        photo.removeAttribute(
          "animation__fade"
        );


        photo.setAttribute(
          "animation__fade",
          {

            property:
              "material.opacity",

            from:
              1,

            to:
              0,

            dur:
              500,

            easing:
              "linear"

          }
        );


        await sleep(550);


        photo.setAttribute(
          "visible",
          false
        );


        photo.removeAttribute(
          "animation__zoom"
        );


        photo.removeAttribute(
          "animation__fade"
        );


        await sleep(250);

      }


      slideshowRunning =
        false;


      if (
        tracking &&
        thisRun === runNumber
      ) {

        await sleep(500);

        startSlideshow();

      }

    }



    target.addEventListener(
      "targetFound",
      () => {


        if (tracking) {

          return;

        }


        tracking =
          true;


        hint.style.display =
          "none";


        startSlideshow();

      }
    );



    target.addEventListener(
      "targetLost",
      () => {


        tracking =
          false;


        runNumber++;


        slideshowRunning =
          false;


        photo.removeAttribute(
          "animation__zoom"
        );


        photo.removeAttribute(
          "animation__fade"
        );


        photo.setAttribute(
          "visible",
          false
        );


        photo.setAttribute(
          "material",
          "opacity",
          0
        );


        hint.style.display =
          "block";

      }
    );

  </script>


</body>

</html>
