<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Laura AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: black;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      background: linear-gradient(
        180deg,
        #ff4fa0,
        #835dff
      );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
      box-sizing: border-box;

      color: white;
      text-align: center;
    }

    #startBox {
      max-width: 420px;

      background: rgba(255,255,255,0.15);

      border-radius: 25px;

      padding: 25px;

      backdrop-filter: blur(10px);
    }

    #startBox h1 {
      font-size: 34px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    #startBox p {
      font-size: 18px;
      line-height: 1.5;
    }

    #startBtn {
      border: none;

      background: white;
      color: black;

      padding: 15px 30px;

      font-size: 18px;
      font-weight: bold;

      border-radius: 50px;

      cursor: pointer;

      margin-top: 15px;
    }

    #hint {
      position: fixed;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      z-index: 9998;

      background: rgba(0,0,0,0.65);

      color: white;

      padding: 10px 18px;

      border-radius: 30px;

      font-size: 14px;

      display: none;

      text-align: center;
    }
  </style>
</head>


<body>

  <!-- EKRAN STARTOWY -->

  <div id="startScreen">

    <div id="startBox">

      <h1>Ożyw ten album 💖</h1>

      <p>
        Kliknij START AR.<br><br>

        Zezwól na dostęp do aparatu,
        a następnie skieruj telefon na
        <b>CAŁĄ stronę „OŻYW TEN ALBUM!”</b>.
      </p>

      <button id="startBtn">
        START AR
      </button>

    </div>

  </div>


  <!-- PODPOWIEDŹ -->

  <div id="hint">
    Skieruj telefon na całą stronę i trzymaj stabilnie 📸
  </div>



  <!-- SCENA AR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
  >



    <!-- ZDJĘCIA -->

    <a-assets>

      <img id="img1" src="./assets/01.jpg">

      <img id="img2" src="./assets/02.jpg">

      <img id="img3" src="./assets/03.jpg">

      <img id="img4" src="./assets/04.jpg">

      <img id="img5" src="./assets/05.jpg">

      <img id="img6" src="./assets/06.jpg">

      <img id="img7" src="./assets/07.jpg">

      <img id="img8" src="./assets/08.jpg">

      <img id="img9" src="./assets/09.jpg">

      <img id="img10" src="./assets/10.jpg">

      <img id="img11" src="./assets/11.jpg">

      <img id="img12" src="./assets/12.jpg">

      <img id="img13" src="./assets/13.jpg">

      <img id="img14" src="./assets/14.jpg">

      <img id="img15" src="./assets/15.jpg">

    </a-assets>



    <!-- KAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>



    <!-- MARKER -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0"
    >



      <!-- TYTUŁ -->

      <a-text

        value="LAURA\n18 LAT WSPOMNIEN"

        align="center"

        color="#ff4fa0"

        width="1.8"

        position="0 0.85 0"

      ></a-text>



      <!-- RZĄD 1 -->

      <a-image
        class="card"
        src="#img1"
        position="-0.50 0.55 0.02"
        rotation="0 0 -10"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img2"
        position="-0.17 0.58 0.03"
        rotation="0 0 6"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img3"
        position="0.17 0.57 0.02"
        rotation="0 0 -5"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img4"
        position="0.50 0.53 0.03"
        rotation="0 0 9"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>



      <!-- RZĄD 2 -->

      <a-image
        class="card"
        src="#img5"
        position="-0.50 0.23 0.03"
        rotation="0 0 7"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img6"
        position="-0.17 0.25 0.04"
        rotation="0 0 -7"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img7"
        position="0.17 0.24 0.02"
        rotation="0 0 5"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img8"
        position="0.50 0.22 0.04"
        rotation="0 0 -8"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>



      <!-- RZĄD 3 -->

      <a-image
        class="card"
        src="#img9"
        position="-0.50 -0.10 0.02"
        rotation="0 0 -5"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img10"
        position="-0.17 -0.08 0.04"
        rotation="0 0 8"
        width="0.27"
        height="0.19"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img11"
        position="0.17 -0.10 0.03"
        rotation="0 0 -7"
        width="0.27"

      </a-image>


      <a-image
        class="card"
        src="#img14"
        position="0 -0.48 0.04"
        rotation="0 0 -4"
        width="0.32"
        height="0.22"
        scale="0 0 0">
      </a-image>


      <a-image
        class="card"
        src="#img15"
        position="0.35 -0.45 0.03"
        rotation="0 0 7"
        width="0.30"
        height="0.21"
        scale="0 0 0">
      </a-image>



      <!-- NAPIS NA DOLE -->

      <a-text

        value="2008 - 2026  |  TO DOPIERO POCZATEK"

        align="center"

        color="#ffffff"

        width="1.9"

        position="0 -0.82 0"

      ></a-text>


    </a-entity>


  </a-scene>



  <!-- SKRYPT -->

  <script>

    const sceneEl =
      document.querySelector("a-scene");


    const startBtn =
      document.getElementById("startBtn");


    const startScreen =
      document.getElementById("startScreen");


    const hint =
      document.getElementById("hint");


    const target =
      document.getElementById("target");


    const cards =
      document.querySelectorAll(".card");



    function resetCards() {

      cards.forEach(card => {

        card.object3D.scale.set(
          0,
          0,
          0
        );

      });

    }



    function animateCards() {

      cards.forEach(
        (card, index) => {

          setTimeout(() => {

            card.setAttribute(
              "animation__pop",
              {

                property: "scale",

                from: "0 0 0",

                to: "1 1 1",

                dur: 500,

                easing: "easeOutBack"

              }
            );

          }, index * 200);

        }
      );

    }



    startBtn.addEventListener(
      "click",
      async () => {

        startScreen.style.display =
          "none";


        hint.style.display =
          "block";


        await sceneEl
          .systems["mindar-image-system"]
          .start();

      }
    );



    target.addEventListener(
      "targetFound",
      () => {

        hint.style.display =
          "none";


        resetCards();


        setTimeout(
          animateCards,
          300
        );

      }
    );



    target.addEventListener(
      "targetLost",
      () => {

        hint.style.display =
          "block";


        resetCards();

      }
    );


    resetCards();

  </script>


</body>

</html>
