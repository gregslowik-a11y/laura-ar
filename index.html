<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Laura 18 AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
  font-family: Arial, sans-serif;
}

a-scene {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
}

canvas {
  background: transparent !important;
}

video.mindar-video,
body > video {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  object-fit: cover !important;
  z-index: -1 !important;
}

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 25px;
  box-sizing: border-box;

  color: white;
  text-align: center;

  background:
    linear-gradient(
      180deg,
      #dca7bd,
      #8c719f
    );
}

#startBox {
  max-width: 420px;

  padding: 28px;

  box-sizing: border-box;

  border-radius: 28px;

  background:
    rgba(
      255,
      255,
      255,
      0.16
    );
}

#startBox h1 {
  margin-top: 0;
  font-size: 34px;
}

#startBox p {
  font-size: 18px;
  line-height: 1.5;
}

#startBtn {
  border: none;

  padding: 15px 30px;

  border-radius: 50px;

  background: white;

  color: #282020;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;
}

#hint {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  z-index: 9998;

  display: none;

  width: 80%;

  padding: 10px 18px;

  box-sizing: border-box;

  border-radius: 30px;

  background:
    rgba(
      0,
      0,
      0,
      0.55
    );

  color: white;

  text-align: center;

  font-size: 14px;
}

</style>
</head>


<body>

<div id="startScreen">

  <div id="startBox">

    <h1>
      Laura 18 ✨
    </h1>

    <p>
      Kliknij START AR.<br><br>

      Zezwól na dostęp do aparatu,
      a następnie skieruj telefon
      na całą stronę
      <b>„OŻYW TEN ALBUM!”</b>.
    </p>

    <button id="startBtn">
      START AR
    </button>

  </div>

</div>


<div id="hint">
  Skieruj telefon na całą stronę i trzymaj stabilnie
</div>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiScanning: yes;
    uiLoading: yes;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

  embedded

>


<a-assets>

  <img id="img1" src="./assets/01.jpg">
  <img id="img2" src="./assets/02.jpg">
  <img id="img3" src="./assets/03.jpg">
  <img id="img4" src="./assets/04.jpg">
  <img id="img5" src="./assets/05.jpg">

  <img id="img6" src="./assets/06.jpg">
  <img id="img7" src="./assets/07.jpg">
  <img id="img8" src="./assets/08.jpg">
  <img id="img9" src="./assets/09.jpg">
  <img id="img10" src="./assets/10.jpg">

  <img id="img11" src="./assets/11.jpg">
  <img id="img12" src="./assets/12.jpg">
  <img id="img13" src="./assets/13.jpg">
  <img id="img14" src="./assets/14.jpg">
  <img id="img15" src="./assets/15.jpg">

  <img id="img16" src="./assets/16.jpg">
  <img id="img17" src="./assets/17.jpg">
  <img id="img18" src="./assets/18.jpg">
  <img id="img19" src="./assets/19.jpg">
  <img id="img20" src="./assets/20.jpg">

</a-assets>


<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>


<a-entity
  id="target"
  mindar-image-target="targetIndex: 0">
</a-entity>


</a-scene>


<script>

const scene =
  document.querySelector("a-scene");

const target =
  document.getElementById("target");

const button =
  document.getElementById("startBtn");

const startScreen =
  document.getElementById("startScreen");

const hint =
  document.getElementById("hint");


const images = [

  document.getElementById("img1"),
  document.getElementById("img2"),
  document.getElementById("img3"),
  document.getElementById("img4"),
  document.getElementById("img5"),

  document.getElementById("img6"),
  document.getElementById("img7"),
  document.getElementById("img8"),
  document.getElementById("img9"),
  document.getElementById("img10"),

  document.getElementById("img11"),
  document.getElementById("img12"),
  document.getElementById("img13"),
  document.getElementById("img14"),
  document.getElementById("img15"),

  document.getElementById("img16"),
  document.getElementById("img17"),
  document.getElementById("img18"),
  document.getElementById("img19"),
  document.getElementById("img20")

];


/*
=========================================
STAŁE ROZMIESZCZENIE

Nie jest losowe przy każdym uruchomieniu,
więc zdjęcia nie wpadają na siebie.
=========================================
*/

const layouts = [

  {x:-0.43, y:0.61, r:-8},
  {x:-0.18, y:0.63, r:5},
  {x:0.08,  y:0.61, r:-4},
  {x:0.34,  y:0.58, r:7},

  {x:-0.44, y:0.37, r:6},
  {x:-0.17, y:0.38, r:-5},
  {x:0.11,  y:0.39, r:4},
  {x:0.39,  y:0.34, r:-7},

  {x:-0.42, y:0.12, r:-5},
  {x:-0.15, y:0.13, r:4},
  {x:0.13,  y:0.13, r:-4},
  {x:0.40,  y:0.08, r:6},

  {x:-0.42, y:-0.14, r:6},
  {x:-0.15, y:-0.13, r:-6},
  {x:0.13,  y:-0.14, r:5},
  {x:0.40,  y:-0.17, r:-5},

  {x:-0.34, y:-0.42, r:-6},
  {x:-0.09, y:-0.45, r:4},
  {x:0.18,  y:-0.44, r:-5},
  {x:0.38,  y:-0.40, r:6}

];


let tracking = false;

let playing = false;

let runId = 0;

let cards = [];

let decorations = [];


function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function clearCards() {

  cards.forEach(card => {

    if (card.parentNode) {

      card.parentNode
        .removeChild(card);

    }

  });


  cards = [];

}


function clearDecorations() {

  decorations.forEach(item => {

    if (item.parentNode) {

      item.parentNode
        .removeChild(item);

    }

  });


  decorations = [];

}


function clearAll() {

  clearCards();

  clearDecorations();

}


/*
=========================================
POLAROID
=========================================
*/

function createPolaroid(
  img,
  layout,
  index
) {

  const w =
    img.naturalWidth;

  const h =
    img.naturalHeight;


  if (!w || !h) {

    return null;

  }


  const ratio =
    w / h;


  let photoWidth;

  let photoHeight;


  /*
  Zdjęcia są mniejsze niż wcześniej,
  żeby 20 sztuk zmieściło się elegancko.
  */


  if (ratio >= 1) {

    photoWidth =
      0.175;

    photoHeight =
      photoWidth / ratio;

  }

  else {

    photoHeight =
      0.175;

    photoWidth =
      photoHeight * ratio;

  }


  const frameWidth =

    Math.max(
      photoWidth + 0.032,
      0.13
    );


  const frameHeight =

    photoHeight +
    0.052;


  const card =
    document.createElement(
      "a-entity"
    );


  card.setAttribute(
    "position",
    `${layout.x} ${layout.y} ${0.035 + index * 0.001}`
  );


  card.setAttribute(
    "rotation",
    `0 0 ${layout.r}`
  );


  card.setAttribute(
    "scale",
    "0 0 0"
  );


  /*
  Delikatny cień
  */

  const shadow =
    document.createElement(
      "a-plane"
    );


  shadow.setAttribute(
    "width",
    frameWidth + 0.008
  );


  shadow.setAttribute(
    "height",
    frameHeight + 0.008
  );


  shadow.setAttribute(
    "color",
    "#000000"
  );


  shadow.setAttribute(
    "position",
    "0.008 -0.008 -0.003"
  );


  shadow.setAttribute(
    "material",
    "shader: flat; opacity: 0.18; transparent: true"
  );


  /*
  Biała ramka
  */

  const frame =
    document.createElement(
      "a-plane"
    );


  frame.setAttribute(
    "width",
    frameWidth
  );


  frame.setAttribute(
    "height",
    frameHeight
  );


  frame.setAttribute(
    "color",
    "#fffdf8"
  );


  frame.setAttribute(
    "position",
    "0 -0.012 0"
  );


  frame.setAttribute(
    "material",
    "shader: flat"
  );


  /*
  Zdjęcie
  */

  const picture =
    document.createElement(
      "a-image"
    );


  picture.setAttribute(
    "src",
    "#" + img.id
  );


  picture.setAttribute(
    "width",
    photoWidth
  );


  picture.setAttribute(
    "height",
    photoHeight
  );


  picture.setAttribute(
    "position",
    "0 0.007 0.003"
  );


  picture.setAttribute(
    "material",
    "shader: flat"
  );


  card.appendChild(shadow);

  card.appendChild(frame);

  card.appendChild(picture);

  target.appendChild(card);

  cards.push(card);


  return card;

}


/*
=========================================
DELIKATNE "OPADANIE"
=========================================
*/

function dropCard(
  card,
  layout,
  index
) {

  const startY =
    layout.y + 0.10;


  const zStart =
    0.18;


  const zEnd =
    0.035 + index * 0.001;


  card.setAttribute(
    "position",
    `${layout.x} ${startY} ${zStart}`
  );


  card.setAttribute(
    "rotation",
    `0 0 ${layout.r - 6}`
  );


  card.setAttribute(
    "scale",
    "1.18 1.18 1.18"
  );


  card.setAttribute(
    "animation__drop",
    {

      property:
        "position",

      from:
        `${layout.x} ${startY} ${zStart}`,

      to:
        `${layout.x} ${layout.y} ${zEnd}`,

      dur:
        700,

      easing:
        "easeOutCubic"

    }
  );


  card.setAttribute(
    "animation__scale",
    {

      property:
        "scale",

      from:
        "1.18 1.18 1.18",

      to:
        "1 1 1",

      dur:
        700,

      easing:
        "easeOutCubic"

    }
  );


  card.setAttribute(
    "animation__rotation",
    {

      property:
        "rotation",

      from:
        `0 0 ${layout.r - 6}`,

      to:
        `0 0 ${layout.r}`,

      dur:
        700,

      easing:
        "easeOutCubic"

    }
  );

}


/*
=========================================
NAPIS PREMIUM
=========================================
*/

function createFinalText() {

  const group =
    document.createElement(
      "a-entity"
    );


  group.setAttribute(
    "position",
    "0 0.88 0.12"
  );


  group.setAttribute(
    "scale",
    "0 0 0"
  );


  /*
  Cień złotego napisu
  */

  const shadow =
    document.createElement(
      "a-text"
    );


  shadow.setAttribute(
    "value",
    "LAURA 18"
  );


  shadow.setAttribute(
    "align",
    "center"
  );


  shadow.setAttribute(
    "width",
    "2.1"
  );


  shadow.setAttribute(
    "color",
    "#7c5a20"
  );


  shadow.setAttribute(
    "position",
    "0.012 -0.012 0"
  );


  /*
  Złoty front
  */

  const title =
    document.createElement(
      "a-text"
    );


  title.setAttribute(
    "value",
    "LAURA 18"
  );


  title.setAttribute(
    "align",
    "center"
  );


  title.setAttribute(
    "width",
    "2.1"
  );


  title.setAttribute(
    "color",
    "#f4d58a"
  );


  title.setAttribute(
    "position",
    "0 0 0.01"
  );


  /*
  Mniejszy napis
  */

  const subtitle =
    document.createElement(
      "a-text"
    );


  subtitle.setAttribute(
    "value",
    "100 LAT!"
  );


  subtitle.setAttribute(
    "align",
    "center"
  );


  subtitle.setAttribute(
    "width",
    "1.4"
  );


  subtitle.setAttribute(
    "color",
    "#ffffff"
  );


  subtitle.setAttribute(
    "position",
    "0 -0.115 0.015"
  );


  group.appendChild(
    shadow
  );


  group.appendChild(
    title
  );


  group.appendChild(
    subtitle
  );


  target.appendChild(
    group
  );


  decorations.push(
    group
  );


  group.setAttribute(
    "animation__show",
    {

      property:
        "scale",

      from:
        "0 0 0",

      to:
        "1 1 1",

      dur:
        1000,

      easing:
        "easeOutBack"

    }
  );


  group.setAttribute(
    "animation__float",
    {

      property:
        "position",

      from:
        "0 0.88 0.12",

      to:
        "0 0.91 0.13",

      dur:
        1800,

      dir:
        "alternate",

      loop:
        true,

      easing:
        "easeInOutSine"

    }
  );

}


/*
=========================================
SUBTELNE KONFETTI
=========================================
*/

function createElegantConfetti() {

  const colors = [

    "#f4d58a",
    "#ffffff",
    "#eac6d3"

  ];


  for (
    let i = 0;
    i < 12;
    i++
  ) {


    const confetti =
      document.createElement(
        "a-plane"
      );


    const x =
      -0.50 +
      Math.random() * 1.0;


    const y =
      0.85 +
      Math.random() * 0.22;


    const endY =
      y -
      (
        0.55 +
        Math.random() * 0.25
      );


    const color =

      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];


    confetti.setAttribute(
      "width",
      0.016
    );


    confetti.setAttribute(
      "height",
      0.008
    );


    confetti.setAttribute(
      "color",
      color
    );


    confetti.setAttribute(
      "position",
      `${x} ${y} 0.16`
    );


    confetti.setAttribute(
      "rotation",
      `0 0 ${Math.random()*360}`
    );


    confetti.setAttribute(
      "material",
      "shader: flat; transparent: true; opacity: 0.9"
    );


    target.appendChild(
      confetti
    );


    decorations.push(
      confetti
    );


    confetti.setAttribute(
      "animation__fall",
      {

        property:
          "position",

        from:
          `${x} ${y} 0.16`,

        to:
          `${x + (Math.random()*0.15 - 0.075)} ${endY} 0.08`,

        dur:
          2600 +
          Math.random()*1000,

        easing:
          "easeInOutSine"

      }
    );


    confetti.setAttribute(
      "animation__spin",
      {

        property:
          "rotation",

        from:
          "0 0 0",

        to:
          "0 0 360",

        dur:
          2500,

        easing:
          "linear"

      }
    );


  }

}


/*
=========================================
START POLAROIDÓW
=========================================
*/

async function startPolaroids() {

  if (playing) {

    return;

  }


  playing =
    true;


  const currentRun =
    ++runId;


  clearAll();


  for (
    let i = 0;
    i < images.length;
    i++
  ) {


    if (
      !tracking ||
      currentRun !== runId
    ) {

      break;

    }


    const img =
      images[i];


    if (!img.complete) {

      await new Promise(
        resolve => {

          img.onload =
            resolve;

          img.onerror =
            resolve;

        }
      );

    }


    if (
      !tracking ||
      currentRun !== runId
    ) {

      break;

    }


    const card =
      createPolaroid(
        img,
        layouts[i],
        i
      );


    if (card) {

      dropCard(
        card,
        layouts[i],
        i
      );

    }


    /*
    850 ms między zdjęciami.
    20 zdjęć = około 17 sekund.
    */

    await sleep(
      850
    );

  }


  if (
    tracking &&
    currentRun === runId
  ) {


    await sleep(
      700
    );


    createFinalText();


    await sleep(
      400
    );


    createElegantConfetti();

  }


  playing =
    false;

}


/*
=========================================
START AR
=========================================
*/

button.addEventListener(
  "click",
  async () => {

    startScreen.style.display =
      "none";


    hint.style.display =
      "block";


    await scene
      .systems[
        "mindar-image-system"
      ]
      .start();

  }
);


/*
=========================================
MARKER ZNALEZIONY
=========================================
*/

target.addEventListener(
  "targetFound",
  () => {

    if (tracking) {

      return;

    }


    tracking =
      true;


    hint.style.display =
      "none";


    startPolaroids();

  }
);


/*
=========================================
MARKER ZGUBIONY
=========================================
*/

target.addEventListener(
  "targetLost",
  () => {

    tracking =
      false;


    runId++;


    playing =
      false;


    clearAll();


    hint.style.display =
      "block";

  }
);

</script>

</body>

</html>
