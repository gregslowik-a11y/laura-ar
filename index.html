<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Laura 18 AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black !important;
  font-family: Arial, sans-serif;
}

a-scene {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  background: transparent !important;
  z-index: 2 !important;
}

a-scene canvas {
  background: transparent !important;
}

video,
video.mindar-video,
body > video {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  object-fit: cover !important;
  z-index: 1 !important;
  background: black !important;
}

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 25px;
  box-sizing: border-box;

  color: white;
  text-align: center;

  background:
    linear-gradient(
      180deg,
      #df9fba,
      #80608c
    );
}

#startBox {
  max-width: 420px;
  padding: 28px;

  border-radius: 28px;

  background:
    rgba(
      255,
      255,
      255,
      0.16
    );
}

#startBox h1 {
  margin-top: 0;
  font-size: 34px;
}

#startBox p {
  font-size: 18px;
  line-height: 1.5;
}

#startBtn {
  border: none;

  padding: 15px 32px;

  border-radius: 50px;

  background: white;

  color: #222;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;
}

#hint {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  z-index: 9998;

  display: none;

  width: 82%;

  padding: 10px 18px;

  box-sizing: border-box;

  border-radius: 30px;

  background:
    rgba(
      0,
      0,
      0,
      0.58
    );

  color: white;

  text-align: center;

  font-size: 14px;
}

</style>
</head>


<body>


<div id="startScreen">

  <div id="startBox">

    <h1>
      Laura 18 ✨
    </h1>

    <p>
      Kliknij START AR.
      <br><br>
      Zezwól na dostęp do aparatu.
      <br><br>
      Skieruj telefon na całą stronę
      <b>„OŻYW TEN ALBUM!”</b>.
    </p>

    <button id="startBtn">
      START AR
    </button>

  </div>

</div>


<div id="hint">
  Skieruj telefon na całą stronę i trzymaj stabilnie 📸
</div>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiScanning: yes;
    uiLoading: yes;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  embedded
>


<a-assets>

  <img id="img1"  src="./assets/01.jpg">
  <img id="img2"  src="./assets/02.jpg">
  <img id="img3"  src="./assets/03.jpg">
  <img id="img4"  src="./assets/04.jpg">
  <img id="img5"  src="./assets/05.jpg">

  <img id="img6"  src="./assets/06.jpg">
  <img id="img7"  src="./assets/07.jpg">
  <img id="img8"  src="./assets/08.jpg">
  <img id="img9"  src="./assets/09.jpg">
  <img id="img10" src="./assets/10.jpg">

  <img id="img11" src="./assets/11.jpg">
  <img id="img12" src="./assets/12.jpg">
  <img id="img13" src="./assets/13.jpg">
  <img id="img14" src="./assets/14.jpg">
  <img id="img15" src="./assets/15.jpg">

  <img id="img16" src="./assets/16.jpg">
  <img id="img17" src="./assets/17.jpg">
  <img id="img18" src="./assets/18.jpg">
  <img id="img19" src="./assets/19.jpg">
  <img id="img20" src="./assets/20.jpg">

  <a-asset-item
    id="confettiModel"
    src="./models/scene.gltf">
  </a-asset-item>

</a-assets>


<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>


<a-entity
  id="target"
  mindar-image-target="targetIndex: 0"
>

  <a-entity
    id="confetti"
    gltf-model="#confettiModel"
    animation-mixer="clip: Main; loop: repeat"
    position="0 0.18 0.20"
    scale="0 0 0"
    visible="false">
  </a-entity>

</a-entity>


</a-scene>


<script>


const scene =
  document.querySelector("a-scene");

const target =
  document.getElementById("target");

const startScreen =
  document.getElementById("startScreen");

const startBtn =
  document.getElementById("startBtn");

const hint =
  document.getElementById("hint");

const confetti =
  document.getElementById("confetti");


const images = [

  document.getElementById("img1"),
  document.getElementById("img2"),
  document.getElementById("img3"),
  document.getElementById("img4"),
  document.getElementById("img5"),

  document.getElementById("img6"),
  document.getElementById("img7"),
  document.getElementById("img8"),
  document.getElementById("img9"),
  document.getElementById("img10"),

  document.getElementById("img11"),
  document.getElementById("img12"),
  document.getElementById("img13"),
  document.getElementById("img14"),
  document.getElementById("img15"),

  document.getElementById("img16"),
  document.getElementById("img17"),
  document.getElementById("img18"),
  document.getElementById("img19"),
  document.getElementById("img20")

];


/*
DUŻE POLAROIDY
*/

const layouts = [

  {x:-0.38, y: 0.57, r:-10},
  {x:-0.12, y: 0.59, r:  6},
  {x: 0.14, y: 0.58, r: -6},
  {x: 0.38, y: 0.54, r: 10},

  {x:-0.40, y: 0.32, r:  8},
  {x:-0.14, y: 0.34, r: -8},
  {x: 0.13, y: 0.33, r:  6},
  {x: 0.39, y: 0.30, r: -9},

  {x:-0.39, y: 0.07, r: -7},
  {x:-0.13, y: 0.08, r:  7},
  {x: 0.14, y: 0.08, r: -6},
  {x: 0.40, y: 0.04, r:  9},

  {x:-0.39, y:-0.19, r:  8},
  {x:-0.13, y:-0.18, r: -8},
  {x: 0.14, y:-0.19, r:  6},
  {x: 0.39, y:-0.22, r: -8},

  {x:-0.34, y:-0.45, r:-9},
  {x:-0.09, y:-0.47, r:  7},
  {x: 0.17, y:-0.46, r: -7},
  {x: 0.37, y:-0.48, r:  9}

];


let tracking = false;

let playing = false;

let runId = 0;

let cards = [];


function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


function clearCards() {

  cards.forEach(card => {

    if (card.parentNode) {

      card.parentNode
        .removeChild(card);

    }

  });

  cards = [];

}


function resetConfetti() {

  confetti.removeAttribute(
    "animation__show"
  );

  confetti.setAttribute(
    "visible",
    false
  );

  confetti.setAttribute(
    "scale",
    "0 0 0"
  );

}


/*
TWORZENIE POLAROIDA
*/

function createPolaroid(
  img,
  layout,
  index
) {


  const w =
    img.naturalWidth;

  const h =
    img.naturalHeight;


  if (!w || !h) {

    return null;

  }


  const ratio =
    w / h;


  let photoWidth;

  let photoHeight;


  if (ratio >= 1) {

    photoWidth =
      0.270;

    photoHeight =
      photoWidth / ratio;

  }

  else {

    photoHeight =
      0.270;

    photoWidth =
      photoHeight * ratio;

  }


  const frameWidth =

    Math.max(
      photoWidth + 0.040,
      0.185
    );


  const frameHeight =

    photoHeight +
    0.070;


  const card =
    document.createElement(
      "a-entity"
    );


  const z =
    0.035 +
    index * 0.0025;


  card.setAttribute(
    "position",
    `${layout.x} ${layout.y} ${z}`
  );


  card.setAttribute(
    "rotation",
    `0 0 ${layout.r}`
  );


  card.setAttribute(
    "scale",
    "0 0 0"
  );


  const shadow =
    document.createElement(
      "a-plane"
    );


  shadow.setAttribute(
    "width",
    frameWidth + 0.015
  );


  shadow.setAttribute(
    "height",
    frameHeight + 0.015
  );


  shadow.setAttribute(
    "color",
    "#000000"
  );


  shadow.setAttribute(
    "position",
    "0.010 -0.010 -0.004"
  );


  shadow.setAttribute(
    "material",
    "shader: flat; transparent: true; opacity: 0.20"
  );


  const frame =
    document.createElement(
      "a-plane"
    );


  frame.setAttribute(
    "width",
    frameWidth
  );


  frame.setAttribute(
    "height",
    frameHeight
  );


  frame.setAttribute(
    "color",
    "#fffdf8"
  );


  frame.setAttribute(
    "position",
    "0 -0.014 0"
  );


  frame.setAttribute(
    "material",
    "shader: flat"
  );


  const picture =
    document.createElement(
      "a-image"
    );


  picture.setAttribute(
    "src",
    "#" + img.id
  );


  picture.setAttribute(
    "width",
    photoWidth
  );


  picture.setAttribute(
    "height",
    photoHeight
  );


  picture.setAttribute(
    "position",
    "0 0.010 0.003"
  );


  picture.setAttribute(
    "material",
    "shader: flat"
  );


  card.appendChild(
    shadow
  );

  card.appendChild(
    frame
  );

  card.appendChild(
    picture
  );

  target.appendChild(
    card
  );

  cards.push(
    card
  );


  return card;

}


/*
WPADANIE POLAROIDA
*/

function dropCard(
  card,
  layout,
  index
) {


  const zEnd =
    0.035 +
    index * 0.0025;


  const startY =
    layout.y +
    0.12;


  card.setAttribute(
    "position",
    `${layout.x} ${startY} 0.27`
  );


  card.setAttribute(
    "rotation",
    `0 0 ${layout.r - 8}`
  );


  card.setAttribute(
    "scale",
    "1.22 1.22 1.22"
  );


  card.setAttribute(
    "animation__drop",
    {

      property:
        "position",

      from:
        `${layout.x} ${startY} 0.27`,

      to:
        `${layout.x} ${layout.y} ${zEnd}`,

      dur:
        750,

      easing:
        "easeOutCubic"

    }
  );


  card.setAttribute(
    "animation__scale",
    {

      property:
        "scale",

      from:
        "1.22 1.22 1.22",

      to:
        "1 1 1",

      dur:
        750,

      easing:
        "easeOutBack"

    }
  );


  card.setAttribute(
    "animation__rotation",
    {

      property:
        "rotation",

      from:
        `0 0 ${layout.r - 8}`,

      to:
        `0 0 ${layout.r}`,

      dur:
        750,

      easing:
        "easeOutCubic"

    }
  );

}


/*
URUCHOMIENIE CONFETTI
*/

async function showConfetti() {

  if (!tracking) {

    return;

  }


  resetConfetti();


  confetti.setAttribute(
    "visible",
    true
  );


  confetti.setAttribute(
    "scale",
    "0.01 0.01 0.01"
  );


  confetti.setAttribute(
    "animation__show",
    {

      property:
        "scale",

      from:
        "0.01 0.01 0.01",

      to:
        "0.40 0.40 0.40",

      dur:
        900,

      easing:
        "easeOutBack"

    }
  );

}


/*
START POLAROIDÓW
*/

async function startPolaroids() {


  if (playing) {

    return;

  }


  playing =
    true;


  const currentRun =
    ++runId;


  clearCards();

  resetConfetti();


  for (
    let i = 0;
    i < images.length;
    i++
  ) {


    if (
      !tracking ||
      currentRun !== runId
    ) {

      break;

    }


    const img =
      images[i];


    if (!img.complete) {

      await new Promise(
        resolve => {

          img.onload =
            resolve;

          img.onerror =
            resolve;

        }
      );

    }


    if (
      !tracking ||
      currentRun !== runId
    ) {

      break;

    }


    const card =
      createPolaroid(
        img,
        layouts[i],
        i
      );


    if (card) {

      dropCard(
        card,
        layouts[i],
        i
      );

    }


    await sleep(
      650
    );

  }


  if (
    tracking &&
    currentRun === runId
  ) {

    await sleep(
      800
    );

    showConfetti();

  }


  playing =
    false;

}


/*
START AR
*/

startBtn.addEventListener(
  "click",
  async () => {

    startScreen.style.display =
      "none";


    hint.style.display =
      "block";


    await scene
      .systems[
        "mindar-image-system"
      ]
      .start();

  }
);


/*
MARKER ZNALEZIONY
*/

target.addEventListener(
  "targetFound",
  () => {


    if (tracking) {

      return;

    }


    tracking =
      true;


    hint.style.display =
      "none";


    startPolaroids();

  }
);


/*
MARKER ZGUBIONY
*/

target.addEventListener(
  "targetLost",
  () => {


    tracking =
      false;


    runId++;


    playing =
      false;


    clearCards();


    resetConfetti();


    hint.style.display =
      "block";

  }
);


</script>


</body>

</html>
