<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Laura 18 AR</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>


<style>

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: black !important;

  font-family:
    Arial,
    sans-serif;

}


a-scene {

  position: fixed !important;

  top: 0 !important;
  left: 0 !important;

  width: 100vw !important;
  height: 100vh !important;

  background:
    transparent !important;

  z-index: 2 !important;

}


a-scene canvas {

  background:
    transparent !important;

}


video,
video.mindar-video,
body > video {

  position:
    fixed !important;

  top: 0 !important;
  left: 0 !important;

  width:
    100vw !important;

  height:
    100vh !important;

  object-fit:
    cover !important;

  z-index:
    1 !important;

  background:
    black !important;

}



#startScreen {

  position: fixed;

  inset: 0;

  z-index: 9999;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 25px;

  box-sizing:
    border-box;

  color: white;

  text-align: center;

  background:

    linear-gradient(
      180deg,
      #dc9fb9,
      #82618f
    );

}


#startBox {

  max-width:
    420px;

  padding:
    28px;

  box-sizing:
    border-box;

  border-radius:
    28px;

  background:

    rgba(
      255,
      255,
      255,
      0.16
    );

}


#startBox h1 {

  margin-top: 0;

  font-size:
    34px;

}


#startBox p {

  font-size:
    18px;

  line-height:
    1.5;

}


#startBtn {

  border: none;

  padding:
    15px 32px;

  border-radius:
    50px;

  background:
    white;

  color:
    #222;

  font-size:
    18px;

  font-weight:
    bold;

  cursor:
    pointer;

}


#hint {

  position:
    fixed;

  left:
    50%;

  bottom:
    20px;

  transform:
    translateX(-50%);

  z-index:
    9998;

  display:
    none;

  width:
    82%;

  padding:
    10px 18px;

  box-sizing:
    border-box;

  border-radius:
    30px;

  background:

    rgba(
      0,
      0,
      0,
      0.58
    );

  color:
    white;

  text-align:
    center;

  font-size:
    14px;

}

</style>

</head>



<body>


<div id="startScreen">

  <div id="startBox">

    <h1>
      Laura 18 ✨
    </h1>

    <p>

      Kliknij START AR.

      <br><br>

      Zezwól na dostęp do aparatu.

      <br><br>

      Skieruj telefon na całą stronę

      <b>
        „OŻYW TEN ALBUM!”
      </b>

    </p>


    <button id="startBtn">

      START AR

    </button>

  </div>

</div>



<div id="hint">

  Skieruj telefon na całą stronę
  i trzymaj stabilnie 📸

</div>



<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiScanning: yes;
    uiLoading: yes;
  "

  color-space="
    sRGB
  "

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

  embedded

>


<a-assets>

  <img id="img1"  src="./assets/01.jpg">
  <img id="img2"  src="./assets/02.jpg">
  <img id="img3"  src="./assets/03.jpg">
  <img id="img4"  src="./assets/04.jpg">
  <img id="img5"  src="./assets/05.jpg">

  <img id="img6"  src="./assets/06.jpg">
  <img id="img7"  src="./assets/07.jpg">
  <img id="img8"  src="./assets/08.jpg">
  <img id="img9"  src="./assets/09.jpg">
  <img id="img10" src="./assets/10.jpg">

  <img id="img11" src="./assets/11.jpg">
  <img id="img12" src="./assets/12.jpg">
  <img id="img13" src="./assets/13.jpg">
  <img id="img14" src="./assets/14.jpg">
  <img id="img15" src="./assets/15.jpg">

  <img id="img16" src="./assets/16.jpg">
  <img id="img17" src="./assets/17.jpg">
  <img id="img18" src="./assets/18.jpg">
  <img id="img19" src="./assets/19.jpg">
  <img id="img20" src="./assets/20.jpg">

</a-assets>



<a-camera

  position="
    0 0 0
  "

  look-controls="
    enabled: false
  "

></a-camera>



<a-entity

  id="target"

  mindar-image-target="
    targetIndex: 0
  "

>

</a-entity>


</a-scene>



<script>


const scene =
  document.querySelector(
    "a-scene"
  );


const target =
  document.getElementById(
    "target"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const startBtn =
  document.getElementById(
    "startBtn"
  );


const hint =
  document.getElementById(
    "hint"
  );



const images = [

  document.getElementById("img1"),
  document.getElementById("img2"),
  document.getElementById("img3"),
  document.getElementById("img4"),
  document.getElementById("img5"),

  document.getElementById("img6"),
  document.getElementById("img7"),
  document.getElementById("img8"),
  document.getElementById("img9"),
  document.getElementById("img10"),

  document.getElementById("img11"),
  document.getElementById("img12"),
  document.getElementById("img13"),
  document.getElementById("img14"),
  document.getElementById("img15"),

  document.getElementById("img16"),
  document.getElementById("img17"),
  document.getElementById("img18"),
  document.getElementById("img19"),
  document.getElementById("img20")

];



/*
=======================================
ROZSYPANE MIEJSCA

Celowo nie są idealną siatką.
Niektóre delikatnie nachodzą.
=======================================
*/


const layouts = [

  {x:-0.39, y: 0.58, r:-11},
  {x:-0.13, y: 0.61, r:  7},
  {x: 0.18, y: 0.58, r: -5},
  {x: 0.39, y: 0.48, r: 11},

  {x:-0.43, y: 0.33, r:  9},
  {x:-0.17, y: 0.35, r: -8},
  {x: 0.10, y: 0.34, r:  6},
  {x: 0.38, y: 0.26, r: -9},

  {x:-0.40, y: 0.08, r: -7},
  {x:-0.13, y: 0.10, r:  8},
  {x: 0.15, y: 0.09, r: -6},
  {x: 0.41, y:-0.01, r: 10},

  {x:-0.42, y:-0.19, r:  8},
  {x:-0.15, y:-0.17, r:-10},
  {x: 0.14, y:-0.19, r:  7},
  {x: 0.39, y:-0.25, r: -8},

  {x:-0.35, y:-0.46, r:-10},
  {x:-0.08, y:-0.48, r:  6},
  {x: 0.20, y:-0.46, r: -7},
  {x: 0.36, y:-0.55, r: 10}

];



let tracking =
  false;


let playing =
  false;


let runId =
  0;


let cards =
  [];


let confettiModels =
  [];



function sleep(ms) {

  return new Promise(

    resolve =>

      setTimeout(
        resolve,
        ms
      )

  );

}



/*
=======================================
USUWANIE POLAROIDÓW
=======================================
*/


function clearCards() {


  cards.forEach(

    card => {


      if (
        card.parentNode
      ) {

        card.parentNode
          .removeChild(card);

      }


    }

  );


  cards = [];

}



/*
=======================================
USUWANIE CONFETTI
=======================================
*/


function clearConfetti() {


  confettiModels.forEach(

    model => {


      if (
        model.parentNode
      ) {

        model.parentNode
          .removeChild(model);

      }


    }

  );


  confettiModels = [];

}



/*
=======================================
POLAROID
=======================================
*/


function createPolaroid(
  img,
  layout,
  index
) {


  const w =
    img.naturalWidth;


  const h =
    img.naturalHeight;


  if (
    !w ||
    !h
  ) {

    return null;

  }


  const ratio =
    w / h;


  let photoWidth;

  let photoHeight;



  /*
  WIĘKSZE ZDJĘCIA
  */


  if (
    ratio >= 1
  ) {


    photoWidth =
      0.225;


    photoHeight =
      photoWidth /
      ratio;


  }


  else {


    photoHeight =
      0.225;


    photoWidth =
      photoHeight *
      ratio;


  }



  const frameWidth =

    Math.max(
      photoWidth + 0.035,
      0.165
    );


  const frameHeight =

    photoHeight +
    0.060;



  const card =
    document.createElement(
      "a-entity"
    );



  const z =
    0.035 +
    index * 0.002;



  card.setAttribute(

    "position",

    `${layout.x} ${layout.y} ${z}`

  );


  card.setAttribute(

    "rotation",

    `0 0 ${layout.r}`

  );


  card.setAttribute(

    "scale",

    "0 0 0"

  );



  /*
  CIEŃ
  */


  const shadow =
    document.createElement(
      "a-plane"
    );


  shadow.setAttribute(

    "width",

    frameWidth +
    0.012

  );


  shadow.setAttribute(

    "height",

    frameHeight +
    0.012

  );


  shadow.setAttribute(

    "color",

    "#000000"

  );


  shadow.setAttribute(

    "position",

    "0.010 -0.010 -0.004"

  );


  shadow.setAttribute(

    "material",

    "shader: flat; transparent: true; opacity: 0.20"

  );



  /*
  RAMKA POLAROID
  */


  const frame =
    document.createElement(
      "a-plane"
    );


  frame.setAttribute(

    "width",

    frameWidth

  );


  frame.setAttribute(

    "height",

    frameHeight

  );


  frame.setAttribute(

    "color",

    "#fffdf7"

  );


  frame.setAttribute(

    "position",

    "0 -0.013 0"

  );


  frame.setAttribute(

    "material",

    "shader: flat"

  );



  /*
  ZDJĘCIE
  */


  const picture =
    document.createElement(
      "a-image"
    );


  picture.setAttribute(

    "src",

    "#" + img.id

  );


  picture.setAttribute(

    "width",

    photoWidth

  );


  picture.setAttribute(

    "height",

    photoHeight

  );


  picture.setAttribute(

    "position",

    "0 0.008 0.003"

  );


  picture.setAttribute(

    "material",

    "shader: flat"

  );



  card.appendChild(
    shadow
  );


  card.appendChild(
    frame
  );


  card.appendChild(
    picture
  );


  target.appendChild(
    card
  );


  cards.push(
    card
  );


  return card;

}



/*
=======================================
WPADANIE POLAROIDA
=======================================
*/


function dropCard(
  card,
  layout,
  index
) {


  const zEnd =
    0.035 +
    index * 0.002;


  const zStart =
    0.28;


  const startY =
    layout.y +
    0.13;



  card.setAttribute(

    "position",

    `${layout.x} ${startY} ${zStart}`

  );


  card.setAttribute(

    "rotation",

    `0 0 ${layout.r - 10}`

  );


  card.setAttribute(

    "scale",

    "1.30 1.30 1.30"

  );



  card.setAttribute(

    "animation__drop",

    {

      property:
        "position",

      from:
        `${layout.x} ${startY} ${zStart}`,

      to:
        `${layout.x} ${layout.y} ${zEnd}`,

      dur:
        800,

      easing:
        "easeOutCubic"

    }

  );



  card.setAttribute(

    "animation__scale",

    {

      property:
        "scale",

      from:
        "1.30 1.30 1.30",

      to:
        "1 1 1",

      dur:
        800,

      easing:
        "easeOutBack"

    }

  );



  card.setAttribute(

    "animation__rotate",

    {

      property:
        "rotation",

      from:
        `0 0 ${layout.r - 10}`,

      to:
        `0 0 ${layout.r}`,

      dur:
        800,

      easing:
        "easeOutCubic"

    }

  );

}



/*
=======================================
TWÓJ MODEL CONFETTI 3D

Używamy scene.gltf
=======================================
*/


function createConfettiModel(
  x,
  y,
  z,
  scale,
  rotation
) {


  const model =
    document.createElement(
      "a-entity"
    );



  model.setAttribute(

    "gltf-model",

    "url(./models/scene.gltf)"

  );



  model.setAttribute(

    "position",

    `${x} ${y} ${z}`

  );



  model.setAttribute(

    "rotation",

    `0 0 ${rotation}`

  );



  model.setAttribute(

    "scale",

    `0 0 0`

  );



  /*
  ODTWARZANIE ANIMACJI
  ZAPISANEJ W MODELU
  */


  model.setAttribute(

    "animation-mixer",

    "clip: *; loop: repeat; repetitions: Infinity; timeScale: 1"

  );



  target.appendChild(
    model
  );


  confettiModels.push(
    model
  );



  model.setAttribute(

    "animation__appear",

    {

      property:
        "scale",

      from:
        "0 0 0",

      to:
        `${scale} ${scale} ${scale}`,

      dur:
        750,

      easing:
        "easeOutBack"

    }

  );


  return model;

}



/*
=======================================
FINAŁ CONFETTI

3 INSTANCJE TEGO SAMEGO MODELU
=======================================
*/


async function launchConfetti() {


  if (
    !tracking
  ) {

    return;

  }



  createConfettiModel(

    -0.30,
    0.18,
    0.18,

    0.24,

    -10

  );



  await sleep(
    250
  );



  createConfettiModel(

    0.30,
    0.18,
    0.19,

    0.24,

    10

  );



  await sleep(
    250
  );



  createConfettiModel(

    0,
    0.50,
    0.20,

    0.30,

    0

  );

}



/*
=======================================
START POLAROIDÓW
=======================================
*/


async function startPolaroids() {


  if (
    playing
  ) {

    return;

  }


  playing =
    true;


  const currentRun =
    ++runId;



  clearCards();


  clearConfetti();



  for (
    let i = 0;
    i < images.length;
    i++
  ) {


    if (
      !tracking ||
      currentRun !== runId
    ) {

      break;

    }



    const img =
      images[i];



    if (
      !img.complete
    ) {


      await new Promise(

        resolve => {


          img.onload =
            resolve;


          img.onerror =
            resolve;


        }

      );


    }



    if (
      !tracking ||
      currentRun !== runId
    ) {

      break;

    }



    const card =
      createPolaroid(

        img,

        layouts[i],

        i

      );



    if (
      card
    ) {


      dropCard(

        card,

        layouts[i],

        i

      );


    }



    /*
    około 0.8 sekundy
    między zdjęciami
    */


    await sleep(
      800
    );

  }



  /*
  KONIEC ZDJĘĆ
  */


  if (
    tracking &&
    currentRun === runId
  ) {


    await sleep(
      800
    );


    launchConfetti();

  }


  playing =
    false;

}



/*
=======================================
START APARATU
=======================================
*/


startBtn.addEventListener(

  "click",

  async () => {


    startScreen.style.display =
      "none";


    hint.style.display =
      "block";


    await scene
      .systems[
        "mindar-image-system"
      ]
      .start();


  }

);



/*
=======================================
MARKER ZNALEZIONY
=======================================
*/


target.addEventListener(

  "targetFound",

  () => {


    if (
      tracking
    ) {

      return;

    }


    tracking =
      true;


    hint.style.display =
      "none";


    startPolaroids();

  }

);



/*
=======================================
MARKER ZGUBIONY
=======================================
*/


target.addEventListener(

  "targetLost",

  () => {


    tracking =
      false;


    runId++;


    playing =
      false;


    clearCards();


    clearConfetti();


    hint.style.display =
      "block";

  }

);


</script>
